<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muse 桥凭证导出工具 (JSON)</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="title-row">
      <div class="brand">
        <img src="icons/icon-32.png" alt="Muse" class="brand-icon" width="22" height="22" />
        <h1>Muse 凭证导出 (JSON)</h1>
      </div>
      <span id="status-badge" class="badge badge-idle">待命</span>
    </div>
    <p class="subtitle">读取浏览器底层 Cookie（含 <code>HttpOnly</code>）与 Token，统一复制与导出为 JSON</p>
  </header>

  <main class="container">
    <div class="controls">
      <button id="btn-fetch" class="btn btn-primary">🔄 重新读取当前登录态</button>
    </div>

    <div id="status-box" class="status-box hidden"></div>

    <section class="card">
      <div class="card-header">
        <span class="card-title">1. 主力凭证：<code>cookies.json</code></span>
        <span id="cookie-stats" class="meta">未读取</span>
      </div>
      <div class="btn-group">
        <button id="btn-dl-cookies" class="btn btn-secondary" disabled>💾 导出 cookies.json</button>
        <button id="btn-cp-cookies" class="btn btn-ghost" disabled>📋 复制 JSON</button>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-title">2. 虚拟机标识：<code>vm_id.json</code></span>
        <span id="vmid-stats" class="meta">未读取</span>
      </div>
      <div class="btn-group">
        <button id="btn-dl-vmid" class="btn btn-secondary" disabled>💾 导出 vm_id.json</button>
        <button id="btn-cp-vmid" class="btn btn-ghost" disabled>📋 复制 JSON</button>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-title">3. 回退凭证：<code>token.json</code></span>
        <span id="token-stats" class="meta">未读取</span>
      </div>
      <div class="btn-group">
        <button id="btn-dl-token" class="btn btn-secondary" disabled>💾 导出 token.json</button>
        <button id="btn-cp-token" class="btn btn-ghost" disabled>📋 复制 JSON</button>
      </div>
    </section>

    <section class="card card-highlight">
      <div class="card-header">
        <span class="card-title">全量凭证合集：<code>muse-credentials.json</code></span>
        <span id="bundle-stats" class="meta">聚合 JSON</span>
      </div>
      <div class="btn-group">
        <button id="btn-dl-all" class="btn btn-accent" disabled>💾 导出全部 JSON</button>
        <button id="btn-cp-all" class="btn btn-ghost" disabled>📋 复制全部 JSON</button>
      </div>
    </section>

    <details class="preview-panel">
      <summary>查看 JSON 结构与脱敏摘要</summary>
      <pre id="summary-output">请先登录 https://muse.ai</pre>
    </details>
  </main>

  <script src="popup.js"></script>
</body>
</html>
